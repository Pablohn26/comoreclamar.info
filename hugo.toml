baseURL = "https://comoreclamar.info/"
locale = "es-ES"
title = "CómoReclamar.info"
theme = "mywiki"
paginate = 10
enableRobotsTXT = true
disqusShortname = ""

[params]
  description = "El que no reclama es porque no quiere."
  # Dirección definitiva del contenido (para la canónica).
  canonicalBase = "https://comoreclamar.info"
  # true = preproducción: no se indexa (robots + noindex).
  # Al pasar al dominio principal, poner false.
  staging = true
  # Receptor de formularios (Hosting Laboratorio). Cambiar a
  # https://peticiones.comoreclamar.info/ cuando el proveedor permita el dominio.
  peticionesURL = "https://peticiones.comoreclamar.info/"
  repoGitHub = "Pablohn26/comoreclamar.info"

[taxonomies]
  category = "category"
  tag = "tag"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

[outputFormats.JSON]
  mediaType = "application/json"
  baseName = "index"
  isPlainText = true

[[menu.main]]
  name = "Organizaciones"
  url = "/organizaciones/"
  weight = 1
[[menu.main]]
  name = "¿Cómo colaborar?"
  url = "/como-colaborar/"
  weight = 2
[[menu.main]]
  name = "No sé cómo reclamar a…"
  url = "/no-se-como-reclamar-a/"
  weight = 3

[markup.goldmark.renderer]
  unsafe = true

[logging]
  ignoreLogs = ["warning-goldmark-raw-html"]

[[menu.main]]
  name = "Curso de transparencia"
  url = "/curso-transparencia-civio/"
  weight = 40
