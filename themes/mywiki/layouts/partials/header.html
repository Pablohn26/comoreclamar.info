<header role="banner">
  <div id="inner-header" class="clearfix">
    <div class="navbar navbar-default top-bg">
      <div class="container" id="navbarcont">
        <div class="row">
          <div class="nav-container col-md-9">
            <nav role="navigation">
              <div class="navbar-header">
                <button type="button" class="navbar-toggle" data-toggle="collapse" data-target=".navbar-collapse">
                  <span class="icon-bar"></span><span class="icon-bar"></span><span class="icon-bar"></span>
                </button>
                <a class="navbar-brand logo" id="logo" title="{{ .Site.Params.description }}" href="{{ "/" | relURL }}">
                  <p><span class="header-text">{{ .Site.Title }}</span></p>
                  <h4><span class="header-description-text">{{ .Site.Params.description }}</span></h4>
                </a>
              </div>
            </nav>
          </div>
          <div class="navbar-collapse collapse top-menu">
            <div class="menu">
              <ul id="menu" class="nav navbar-nav navbar-right mywiki-header-menu">
                {{ range .Site.Menus.main }}
                <li class="menu-item"><a href="{{ .URL | relURL }}">{{ .Name }}</a></li>
                {{ end }}
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
